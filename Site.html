/* =========================================================================

let currentSlide = 0;

/* =========================================================================
   INITIALIZE SLIDER
   ========================================================================= */

function initNexusSlider() {

    const track =
        document.getElementById('nexus-slider-track');

    const dotsContainer =
        document.getElementById('nexus-slider-dots');

    const slides =
        NEXUS_WOO_CONFIG.slides;


    if (
        !track ||
        !dotsContainer ||
        slides.length === 0
    ) {
        return;
    }


    track.innerHTML = '';
    dotsContainer.innerHTML = '';


    slides.forEach((slide, idx) => {

        const slideA =
            document.createElement('a');

        slideA.href =
            slide.link || '#';

        slideA.className =
            'nexus-slide-item';

        slideA.target =
            '_self';


        slideA.innerHTML = `
            <img
                src="${slide.img}"
                alt="${slide.title || 'Slide'}"
                loading="${idx === 0 ? 'eager' : 'lazy'}"
            >
        `;


        track.appendChild(slideA);


        const dot =
            document.createElement('div');

        dot.className =
            `nexus-dot ${idx === 0 ? 'active' : ''}`;


        dot.onclick =
            () => goToSlide(idx);


        dotsContainer.appendChild(dot);

    });


    const prevButton =
        document.getElementById('slider-prev-btn');

    const nextButton =
        document.getElementById('slider-next-btn');


    if (prevButton) {

        prevButton.onclick =
            () => prevSlide();

    }


    if (nextButton) {

        nextButton.onclick =
            () => nextSlide();

    }


    /* ---------------------------------------------------------------------
       TOUCH / SWIPE
       --------------------------------------------------------------------- */

    let startX = 0;
    let endX = 0;


    const sliderEl =
        document.getElementById('nexus-hero-slider');


    if (!sliderEl) {
        return;
    }


    sliderEl.addEventListener(
        'touchstart',
        (e) => {

            startX =
                e.touches[0].clientX;

            stopAutoSlide();

        },
        {
            passive: true
        }
    );


    sliderEl.addEventListener(
        'touchend',
        (e) => {

            endX =
                e.changedTouches[0].clientX;


            const threshold = 40;


            if (
                startX - endX >
                threshold
            ) {

                nextSlide();

            }

            else if (
                endX - startX >
                threshold
            ) {

                prevSlide();

            }


            startAutoSlide();

        },
        {
            passive: true
        }
    );


    sliderEl.addEventListener(
        'mouseenter',
        stopAutoSlide
    );


    sliderEl.addEventListener(
        'mouseleave',
        startAutoSlide
    );


    startAutoSlide();

}


/* =========================================================================
   UPDATE SLIDER
   ========================================================================= */

function updateSliderUI() {

    const track =
        document.getElementById('nexus-slider-track');

    const dots =
        document.querySelectorAll('.nexus-dot');

    const totalSlides =
        NEXUS_WOO_CONFIG.slides.length;


    if (!track || totalSlides === 0) {
        return;
    }


    if (
        currentSlide >=
        totalSlides
    ) {

        currentSlide = 0;

    }


    if (
        currentSlide < 0
    ) {

        currentSlide =
            totalSlides - 1;

    }


    track.style.transform =
        `translateX(${currentSlide * 100}%)`;


    dots.forEach(
        (dot, idx) => {

            dot.classList.toggle(
                'active',
                idx === currentSlide
            );

        }
    );

}


function nextSlide() {

    currentSlide++;

    updateSliderUI();

}


function prevSlide() {

    currentSlide--;

    updateSliderUI();

}


function goToSlide(index) {

    currentSlide =
        index;

    updateSliderUI();

}


function startAutoSlide() {

    stopAutoSlide();

    autoSlideTimer =
        setInterval(
            () => {

                nextSlide();

            },
            4000
        );

}


function stopAutoSlide() {

    if (autoSlideTimer) {

        clearInterval(
            autoSlideTimer
        );

        autoSlideTimer = null;

    }

}


/* =========================================================================
   PRODUCT HTML GENERATOR
   ========================================================================= */

function generateProductsHTML(
    products,
    cat
) {

    let html = '';


    if (
        !Array.isArray(products) ||
        products.length === 0
    ) {

        products =
            FALLBACK_DEMO_DATA.default;

    }


    const repeatCount =
        Math.max(
            3,
            Math.ceil(
                12 / products.length
            )
        );


    for (
        let r = 0;
        r < repeatCount;
        r++
    ) {

        products.forEach(
            (p) => {

                const productName =
                    p.name ||
                    'محصول اپل استار';


                const productImage =
                    p.img ||
                    cat.image;


                const productLink =
                    p.permalink ||
                    '#';


                const productPrice =
                    p.price ||
                    'تماس بگیرید';


                html += `

                    <a
                        href="${productLink}"
                        class="nexus-product-card"
                        target="_self"
                    >

                        <div class="nexus-product-thumb">

                            <img
                                src="${productImage}"
                                alt="${productName}"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='${cat.image}';"
                            >

                        </div>


                        <div class="nexus-product-title">
                            ${productName}
                        </div>


                        <div class="nexus-product-footer">

                            <div class="nexus-product-price">
                                ${productPrice}
                            </div>


                            <div class="nexus-add-btn">

                                <i class="fa-solid fa-arrow-left"></i>

                            </div>

                        </div>

                    </a>

                `;

            }
        );

    }


    return html;

}


/* =========================================================================
   BUILD INITIAL UI
   ========================================================================= */

function buildInitialUI() {

    if (nexusIsInitialized) {
        return;
    }


    initNexusSlider();


    const gridContainer =
        document.getElementById(
            'nexus-categories-grid'
        );


    const beltsContainer =
        document.getElementById(
            'nexus-belts-wrapper'
        );


    if (
        !gridContainer ||
        !beltsContainer
    ) {

        return;

    }


    gridContainer.innerHTML = '';
    beltsContainer.innerHTML = '';


    /* ---------------------------------------------------------------------
       LOOP THROUGH CATEGORIES
       --------------------------------------------------------------------- */

    NEXUS_WOO_CONFIG.categories.forEach(
        (cat, index) => {


            /* =============================================================
               CATEGORY GRID CARD
               ============================================================= */

            const card =
                document.createElement('a');


            card.className =
                'nexus-category-card';
                
            card.href =
                cat.catUrl;
                
            card.target =
                '_self';


            card.innerHTML = `

                <div class="nexus-card-info">

                    <h4>
                        ${cat.title}
                    </h4>

                    <span>

                        <i class="${cat.icon}"></i>

                        ${cat.subTitle}

                    </span>

                </div>


                <div class="nexus-card-img-wrapper">

                    <img
                        src="${cat.image}"
                        alt="${cat.title}"
                        loading="lazy"
                    >

                </div>


                <div class="nexus-card-glow"></div>

            `;


            gridContainer.appendChild(
                card
            );


            /* =============================================================
               PRODUCT BELT
               ============================================================= */

            const beltSection =
                document.createElement('div');


            beltSection.className =
                'nexus-belt-section';


            beltSection.id =
                `belt-${cat.id}`;


            const directionClass =
                (index % 2 === 0)
                    ? 'nexus-move-rtl'
                    : 'nexus-move-ltr';


            const demoProducts =
                FALLBACK_DEMO_DATA[cat.id] ||
                FALLBACK_DEMO_DATA.default;


            beltSection.innerHTML = `

                <div class="nexus-belt-header">

                    <a
                        href="${cat.catUrl}"
                        target="_self"
                        class="nexus-belt-title-link"
                    >

                        <i
                            class="${cat.icon}"
                            style="color: var(--beige-dark);"
                        ></i>

                        محصولات دسته
                        ${cat.title}

                    </a>


                    <a
                        href="${cat.catUrl}"
                        target="_self"
                        class="nexus-belt-view-all"
                    >

                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>

                    </a>

                </div>


                <div class="nexus-belt-track-container">

                    <div
                        class="nexus-belt-track ${directionClass}"
                        id="track-${cat.id}"
                    >

                        ${generateProductsHTML(
                            demoProducts,
                            cat
                        )}

                    </div>

                </div>

            `;


            beltsContainer.appendChild(
                beltSection
            );


            /* =============================================================
               WOOCOMMERCE API
               ============================================================= */

            if (
                NEXUS_WOO_CONFIG
                    .fetchFromWooCommerce
            ) {

                fetchAndHydrateWooData(
                    cat
                );

            }

        }
    );


    nexusIsInitialized =
        true;

}


/* =========================================================================
   WOOCOMMERCE API ENGINE
   ========================================================================= */

async function fetchAndHydrateWooData(cat) {

    try {

        const apiUrl =
            `${NEXUS_WOO_CONFIG.baseUrl}/wp-json/wc/store/v1/products?category=${cat.wcCatId}&per_page=8`;


        const response =
            await fetch(apiUrl);


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            return;

        }


        const wooProducts =
            data.map(
                (item) => {


                    let formattedPrice =
                        'تماس بگیرید';


                    /* -----------------------------------------------------
                       PRICE
                       ----------------------------------------------------- */

                    if (
                        item.prices &&
                        item.prices.price
                    ) {

                        const rawPrice =
                            parseInt(
                                item.prices.price,
                                10
                            ) /
                            Math.pow(
                                10,
                                item.prices.currency_minor_unit || 0
                            );


                        formattedPrice =
                            rawPrice.toLocaleString(
                                'fa-IR'
                            ) +
                            ' ' +
                            (
                                item.prices.currency_symbol ||
                                'تومان'
                            );

                    }


                    /* -----------------------------------------------------
                       IMAGE
                       ----------------------------------------------------- */

                    const imageSrc =
                        (
                            item.images &&
                            item.images.length > 0
                        )
                            ? item.images[0].src
                            : cat.image;


                    return {

                        name:
                            item.name,

                        price:
                            formattedPrice,

                        permalink:
                            item.permalink ||
                            '#',

                        img:
                            imageSrc

                    };

                }
            );


        const trackEl =
            document.getElementById(
                `track-${cat.id}`
            );


        if (trackEl) {

            trackEl.innerHTML =
                generateProductsHTML(
                    wooProducts,
                    cat
                );

        }

    }

    catch (e) {

        console.log(
            `سیستم: عدم دریافت اطلاعات دسته ${cat.title} - استفاده از دیتای آفلاین.`
        );

    }

}


/* =========================================================================
   SAFE INITIALIZATION FOR ELEMENTOR
   ========================================================================= */

if (
    document.readyState === 'complete' ||
    document.readyState === 'interactive'
) {

    setTimeout(
        buildInitialUI,
        100
    );

}

else {

    document.addEventListener(
        'DOMContentLoaded',
        buildInitialUI
    );

}
</script>
