<!DOCTYPE html>

<head>

    <style>

        @keyframes nexusMarqueeRTL {

        /* کارت محصول داخل نوار متحرک */

        .nexus-product-footer {

        }

            font-size: 13px;

        .nexus-add-btn {

        }

        .nexus-product-card:hover .nexus-add-btn {

        /* رسپانسیو */
        @media (max-width: 1024px) {

        @media (max-width: 768px) {

            .nexus-product-title { font-size: 12px; }
            .nexus-product-price { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="nexus-widget-wrapper">
        <div class="nexus-container">
            
            <!-- بخش ۱: شبکه‌ای از دسته‌بندی‌ها (۸ تایی: ۴ بالا، ۴ پایین) -->
            <section>
                <div class="nexus-section-header">
                    <h2 class="nexus-section-title">دسته‌بندی محصولات</h2>
                </div>
                <div class="nexus-nav-grid" id="nexus-categories-grid">
                    <!-- توسط JS ساختاربندی می‌شود -->
                </div>
            </section>

            <!-- بخش ۲: نوارهای متحرک ۸ تایی (Moving Belts) -->
            <section>
                <div class="nexus-section-header">
                    <h2 class="nexus-section-title">ویترین متحرک محصولات</h2>
                </div>
                <div class="nexus-belts-wrapper" id="nexus-belts-wrapper">
                    <!-- توسط JS بارگذاری می‌شود -->
                </div>
            </section>

        </div>
    </div>

    <script>
        /* =========================================================================
           ⚙️ بخش تنظیمات اختصاصی وردپرس و ووکامرس (WOOCOMMERCE CONFIG)
           =========================================================================
           محمد جان، تمام مقادیری که می‌خواهی به ووکامرس وصل کنی همینجا قرار دارن.
           
           پارامترهای هر دسته‌بندی:
           - wcCatId: شناسه عددی (ID) دسته‌بندی در ووکامرس (مثلا: 15)
           - wcSlug: نامک دسته‌بندی در ووکامرس (مثلا: 'iphone')
           - catUrl: لینک کامل یا نسبی برگه دسته‌بندی در سایت (مثلا: '/product-category/iphone/')
           - title: عنوان نمایش داده شده در کارت
           - subTitle: زیرعنوان یا توضیح کوتاه
           - image: عکس وکتور/تصویر دسته‌بندی
           ========================================================================= */

        const NEXUS_WOO_CONFIG = {
            // آیا درخواست اتوماتیک به API ووکامرس ارسال شود؟ (روی true قرار دهید)
            fetchFromWooCommerce: true,

            // آدرس پایه وب‌سایت (به طور خودکار دامنه‌ای که کد روی آن اجرا می‌شود را می‌گیرد)
            baseUrl: window.location.origin,

            // تنظیمات کامل ۸ دسته‌بندی اصلی سایت شما:
            categories: [
                {
                    id: 'cat-1',
                    wcCatId: 15, // 👈 آیدی دسته‌بندی ووکامرس
                    wcSlug: 'iphone', // 👈 نامک (Slug) دسته‌بندی
                    catUrl: '/product-category/iphone/', // 👈 لینک برگه دسته‌بندی جهت باز شدن کامل
                    title: 'آیفون‌ها',
                    subTitle: 'سری ۱۶ و ۱۵ پرو',
                    image: 'https://pngimg.com/uploads/iphone_14/iphone_14_PNG18.png',
                    icon: 'fa-brands fa-apple'
                },
                {
                    id: 'cat-2',
                    wcCatId: 20,
                    wcSlug: 'android',
                    catUrl: '/product-category/android/',
                    title: 'اندروید',
                    subTitle: 'سامسونگ و شیائومی',
                    image: 'https://pngimg.com/uploads/samsung_galaxy/samsung_galaxy_PNG11.png',
                    icon: 'fa-brands fa-android'
                },
                {
                    id: 'cat-3',
                    wcCatId: 25,
                    wcSlug: 'macbook',
                    catUrl: '/product-category/macbook/',
                    title: 'مک‌بوک',
                    subTitle: 'تراشه‌های M3 و M2',
                    image: 'https://pngimg.com/uploads/macbook/macbook_PNG8.png',
                    icon: 'fa-solid fa-laptop'
                },
                {
                    id: 'cat-4',
                    wcCatId: 30,
                    wcSlug: 'windows-laptop',
                    catUrl: '/product-category/laptops/',
                    title: 'لپ‌تاپ ویندوز',
                    subTitle: 'طراحی و گیمینگ',
                    image: 'https://pngimg.com/uploads/laptop/laptop_PNG5654.png',
                    icon: 'fa-brands fa-windows'
                },
                {
                    id: 'cat-5',
                    wcCatId: 35,
                    wcSlug: 'ipad',
                    catUrl: '/product-category/ipad/',
                    title: 'آیپدها',
                    subTitle: 'پرو و ایر M2',
                    image: 'https://pngimg.com/uploads/ipad/ipad_PNG10212.png',
                    icon: 'fa-solid fa-tablet-screen-button'
                },
                {
                    id: 'cat-6',
                    wcCatId: 40,
                    wcSlug: 'android-tablet',
                    catUrl: '/product-category/tablets/',
                    title: 'تبلت اندروید',
                    subTitle: 'سری گلکسی تب',
                    image: 'https://pngimg.com/uploads/tablet/tablet_PNG8588.png',
                    icon: 'fa-solid fa-tablet'
                },
                {
                    id: 'cat-7',
                    wcCatId: 45,
                    wcSlug: 'consoles',
                    catUrl: '/product-category/consoles/',
                    title: 'کنسول بازی',
                    subTitle: 'PS5 و ایکس‌باکس',
                    image: 'https://pngimg.com/uploads/gamepad/gamepad_PNG122.png',
                    icon: 'fa-solid fa-gamepad'
                },
                {
                    id: 'cat-8',
                    wcCatId: 50,
                    wcSlug: 'gadgets',
                    catUrl: '/product-category/gadgets/',
                    title: 'گجت‌ها',
                    subTitle: 'اپل واچ و ایرپاد',
                    image: 'https://pngimg.com/uploads/apple_watch/apple_watch_PNG23.png',
                    icon: 'fa-solid fa-headphones'
                }
            ]
        };

        // داده‌های فال‌بک لوکس (زمانی که سایت قطعه یا محصولی در آن دسته ثبت نشده)
        const FALLBACK_DEMO_DATA = {
            'cat-1': [
                { name: 'آیفون ۱۵ پرو مکس ۱ ترابایت', price: '۸۴,۵۰۰,۰۰۰ تومان', permalink: '#', img: 'https://pngimg.com/uploads/iphone_14/iphone_14_PNG18.png' },
                { name: 'آیفون ۱۵ پرو ۲۵۶ گیگابایت', price: '۶۹,۸۰۰,۰۰۰ تومان', permalink: '#', img: 'https://pngimg.com/uploads/iphone_14/iphone_14_PNG18.png' }
            ],
            'cat-2': [
                { name: 'سامسونگ گلکسی S24 اولترا', price: '۶۸,۰۰۰,۰۰۰ تومان', permalink: '#', img: 'https://pngimg.com/uploads/samsung_galaxy/samsung_galaxy_PNG11.png' },
                { name: 'شیائومی ۱۴ پرو ۵۱۲ گیگ', price: '۵۴,۲۰۰,۰۰۰ تومان', permalink: '#', img: 'https://pngimg.com/uploads/samsung_galaxy/samsung_galaxy_PNG11.png' }
            ],
            'default': [
                { name: 'محصول ویژه‌ لوکس دیجیتال', price: 'تماس بگیرید', permalink: '#', img: 'https://via.placeholder.com/200?text=Nexus+Gear' }
            ]
        };

        // تابع اسکرول نرم به نوار مربوطه
        function scrollToBelt(id) {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // تابع اصلی دریافت محصولات از WooCommerce Store API
        async function fetchWooProducts(category) {
            if (!NEXUS_WOO_CONFIG.fetchFromWooCommerce) {
                return FALLBACK_DEMO_DATA[category.id] || FALLBACK_DEMO_DATA['default'];
            }

            try {
                // استفاده از REST API استاندارد و عمومی ووکامرس (Store API بدون نیاز به کلیدSecret)
                const apiUrl = `${NEXUS_WOO_CONFIG.baseUrl}/wp-json/wc/store/v1/products?category=${category.wcCatId}&per_page=8`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error('فراخوانی API ووکامرس ناموفق بود');
                }

                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    return data.map(item => {
                        let formattedPrice = 'تماس بگیرید';
                        if (item.prices && item.prices.price) {
                            const rawPrice = parseInt(item.prices.price) / Math.pow(10, item.prices.currency_minor_unit || 0);
                            formattedPrice = rawPrice.toLocaleString('fa-IR') + ' ' + (item.prices.currency_symbol || 'تومان');
                        }

                        const imageSrc = (item.images && item.images.length > 0) 
                            ? item.images[0].src 
                            : category.image;

                        return {
                            name: item.name,
                            price: formattedPrice,
                            permalink: item.permalink || '#', // 👈 لینک مستقیم محصول واقعی در ووکامرس
                            img: imageSrc
                        };
                    });
                } else {
                    // اگر در ووکامرس محصولی ثبت نشده بود، داده پیش‌فرض می‌آید
                    return FALLBACK_DEMO_DATA[category.id] || FALLBACK_DEMO_DATA['default'];
                }

            } catch (error) {
                console.warn(`[Nexus Widget] خطا در بارگذاری محصولات دسته ${category.title}، استفاده از داده پیش‌فرض:`, error);
                return FALLBACK_DEMO_DATA[category.id] || FALLBACK_DEMO_DATA['default'];
            }
        }

        // اجرای ساختار ویجت پس از لود صفحه
        document.addEventListener('DOMContentLoaded', async () => {
            const gridContainer = document.getElementById('nexus-categories-grid');
            const beltsContainer = document.getElementById('nexus-belts-wrapper');

            for (let index = 0; index < NEXUS_WOO_CONFIG.categories.length; index++) {
                const cat = NEXUS_WOO_CONFIG.categories[index];

                // ۱. رندر کارت دسته‌بندی بالای صفحه
                const card = document.createElement('div');
                card.className = 'nexus-category-card';
                card.onclick = () => scrollToBelt(`belt-${cat.id}`);
                card.innerHTML = `
                    <div class="nexus-card-info">
                        <h4>${cat.title}</h4>
                        <span><i class="${cat.icon}"></i> ${cat.subTitle}</span>
                    </div>
                    <div class="nexus-card-img-wrapper">
                        <img src="${cat.image}" alt="${cat.title}" onerror="this.src='https://via.placeholder.com/100?text=${cat.title}'">
                    </div>
                    <div class="nexus-card-glow"></div>
                `;
                gridContainer.appendChild(card);

                // ۲. رندر بخش نوار متحرک برای این دسته‌بندی
                const beltSection = document.createElement('div');
                beltSection.className = 'nexus-belt-section';
                beltSection.id = `belt-${cat.id}`;

                // جهت حرکت متناوب (یکی راست‌به‌چپ، یکی چپ‌به‌راست)
                const directionClass = (index % 2 === 0) ? 'nexus-move-rtl' : 'nexus-move-ltr';

                // دریافت محصولات واقعی از ووکامرس یا فال‌بک
                const products = await fetchWooProducts(cat);

                // تکرار کارت‌ها برای ایجاد حرکت بی‌نهایت (Infinite Loop)
                let productsHTML = '';
                const repeatCount = Math.max(3, Math.ceil(12 / products.length));
                
                for (let r = 0; r < repeatCount; r++) {
                    products.forEach(p => {
                        productsHTML += `
                            <a href="${p.permalink}" class="nexus-product-card" target="_self">
                                <div class="nexus-product-thumb">
                                    <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/120?text=Product'">
                                </div>
                                <div class="nexus-product-title">${p.name}</div>
                                <div class="nexus-product-footer">
                                    <div class="nexus-product-price">${p.price}</div>
                                    <div class="nexus-add-btn"><i class="fa-solid fa-arrow-left"></i></div>
                                </div>
                            </a>
                        `;
                    });
                }

                // دکمه «مشاهده همه» لینک مستقیم به برگه دسته‌بندی ووکامرس دارد
                beltSection.innerHTML = `
                    <div class="nexus-belt-header">
                        <h3><i class="${cat.icon}" style="color: var(--accent-purple);"></i> محصولات دسته ${cat.title}</h3>
                        <a href="${cat.catUrl}" target="_self">مشاهده همه <i class="fa-solid fa-arrow-left"></i></a>
                    </div>
                    <div class="nexus-belt-track-container">
                        <div class="nexus-belt-track ${directionClass}">
                            ${productsHTML}
                        </div>
                    </div>
                `;

                beltsContainer.appendChild(beltSection);
            }
        });
    </script>
</body>
</html>
