    function scrollToBelt(id) {
        const el = document.getElementById(id);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    async function fetchWooProducts(category) {
        if (!NEXUS_WOO_CONFIG.fetchFromWooCommerce) {
            return FALLBACK_DEMO_DATA[category.id] || FALLBACK_DEMO_DATA['default'];
        }
        try {
            const apiUrl = `${NEXUS_WOO_CONFIG.baseUrl}/wp-json/wc/store/v1/products?category=${category.wcCatId}&per_page=8`;
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('فراخوانی API ناموفق بود');
            const data = await response.json();
            
            if (Array.isArray(data) && data.length > 0) {
                return data.map(item => {
                    let formattedPrice = 'تماس بگیرید';
                    if (item.prices && item.prices.price) {
                        const rawPrice = parseInt(item.prices.price) / Math.pow(10, item.prices.currency_minor_unit || 0);
                        formattedPrice = rawPrice.toLocaleString('fa-IR') + ' ' + (item.prices.currency_symbol || 'تومان');
                    }
                    const imageSrc = (item.images && item.images.length > 0) ? item.images[0].src : category.image;
                    return { name: item.name, price: formattedPrice, permalink: item.permalink || '#', img: imageSrc };
                });
            } else {
                return FALLBACK_DEMO_DATA[category.id] || FALLBACK_DEMO_DATA['default'];
            }
        } catch (error) {
            return FALLBACK_DEMO_DATA[category.id] || FALLBACK_DEMO_DATA['default'];
        }
    }

    async function initNexusWidget() {
        const gridContainer = document.getElementById('nexus-categories-grid');
        const beltsContainer = document.getElementById('nexus-belts-wrapper');

        if (!gridContainer || !beltsContainer) return;
        
        // جلوگیری از دوباره رندر شدن تکراری
        if (gridContainer.getAttribute('data-rendered') === 'true') return;
        gridContainer.setAttribute('data-rendered', 'true');

        gridContainer.innerHTML = '';
        beltsContainer.innerHTML = '';

        for (let index = 0; index < NEXUS_WOO_CONFIG.categories.length; index++) {
            const cat = NEXUS_WOO_CONFIG.categories[index];

            // ۱. رندر کارت‌های دسته‌بندی
            const card = document.createElement('div');
            card.className = 'nexus-category-card';
            card.onclick = () => scrollToBelt(`belt-${cat.id}`);
            card.innerHTML = `
                <div class="nexus-card-info">
                    <h4>${cat.title}</h4>
                    <span><i class="${cat.icon}"></i> ${cat.subTitle}</span>
                </div>
                <div class="nexus-card-img-wrapper">
                    <img src="${cat.image}" alt="${cat.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=${cat.title}';">
                </div>
                <div class="nexus-card-glow"></div>
            `;
            gridContainer.appendChild(card);

            // ۲. رندر بخش نوارهای متحرک
            const beltSection = document.createElement('div');
            beltSection.className = 'nexus-belt-section';
            beltSection.id = `belt-${cat.id}`;
            const directionClass = (index % 2 === 0) ? 'nexus-move-rtl' : 'nexus-move-ltr';
            const products = await fetchWooProducts(cat);

            let productsHTML = '';
            const repeatCount = Math.max(3, Math.ceil(12 / products.length));
            
            for (let r = 0; r < repeatCount; r++) {
                products.forEach(p => {
                    productsHTML += `
                        <a href="${p.permalink}" class="nexus-product-card" target="_self">
                            <div class="nexus-product-thumb">
                                <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null; this.src='${cat.image}';">
                            </div>
                            <div class="nexus-product-title">${p.name}</div>
                            <div class="nexus-product-footer">
                                <div class="nexus-product-price">${p.price}</div>
                                <div class="nexus-add-btn"><i class="fa-solid fa-arrow-left"></i></div>
                            </div>
                        </a>
                    `;
                });
            }

            beltSection.innerHTML = `
                <div class="nexus-belt-header">
                    <h3><i class="${cat.icon}" style="color: var(--beige-dark);"></i> محصولات دسته ${cat.title}</h3>
                    <a href="${cat.catUrl}" target="_self">مشاهده همه <i class="fa-solid fa-arrow-left"></i></a>
                </div>
                <div class="nexus-belt-track-container">
                    <div class="nexus-belt-track ${directionClass}">
                        ${productsHTML}
                    </div>
                </div>
            `;

            beltsContainer.appendChild(beltSection);
        }
    }

    // اجرا هم برای حالت عادی و هم برای ویرایشگر المنتور
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNexusWidget);
    } else {
        initNexusWidget();
    }
</script>
